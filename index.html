<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &amp; Latency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --void:#0D1117;
    --void-soft:#161B24;
    --paper:#E8E2D0;
    --paper-dim:#DCD5BF;
    --ink:#1B1F27;
    --ink-soft:#5A5648;
    --up:#2F9E6E;
    --down:#C24A32;
    --gold:#B58A3D;
    --slate:#6B7280;
    --rule: rgba(27,31,39,0.14);
    --rule-dark: rgba(232,226,208,0.16);
    --max: 1200px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- TICKER ---------- */
  .ticker-wrap{
    background:var(--void);
    color:var(--paper);
    overflow:hidden;
    white-space:nowrap;
    border-bottom:1px solid var(--rule-dark);
    position:relative;
  }
  .ticker-wrap::after{
    content:"";
    position:absolute; top:0; right:0; bottom:0; width:60px;
    background:linear-gradient(to right, transparent, var(--void));
    pointer-events:none;
  }
  .ticker{
    display:inline-flex;
    align-items:center;
    gap:2.5rem;
    padding:9px 0;
    animation: scroll-left 32s linear infinite;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.02em;
  }
  .ticker span.item{ display:inline-flex; align-items:center; gap:0.5em; }
  .ticker .up{ color:var(--up); }
  .ticker .down{ color:var(--down); }
  .ticker .dot{ opacity:0.35; padding:0 0.4em; }

  @keyframes scroll-left{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-50%); }
  }

  /* ---------- MASTHEAD ---------- */
  .masthead{
    max-width:var(--max);
    margin:0 auto;
    padding:52px 28px 30px;
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .eyebrow .sep{ color:var(--gold); margin:0 0.6em; }
  #status-line{ font-style:normal; }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.6rem, 7vw, 5rem);
    line-height:0.95;
    letter-spacing:-0.01em;
    margin:0;
  }
  .wordmark .amp{
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    padding:0 0.08em;
  }

  .subline{
    margin-top:16px;
    font-size:1rem;
    color:var(--ink-soft);
    font-weight:400;
  }
  .subline em{
    font-style:italic;
    font-family:'Fraunces', serif;
    color:var(--ink);
  }

  .masthead-rule{
    max-width:var(--max);
    margin:0 auto;
    border:0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    height:6px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
    opacity:0.55;
  }

  /* ---------- LAYOUT ---------- */
  .desks{
    max-width:var(--max);
    margin:0 auto;
    padding:40px 28px 20px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:40px;
  }
  @media (max-width: 980px){
    .desks{ grid-template-columns:1fr; gap:8px; }
  }

  .desk-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  .desk-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .desk-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
  }

  .card{
    padding:16px 0;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .card:last-child{ border-bottom:0; }

  .card-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
    flex-wrap:wrap;
  }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    letter-spacing:0.04em;
    padding:2px 7px;
    border-radius:3px;
    border:1px solid currentColor;
    white-space:nowrap;
  }
  .tag.up{ color:var(--up); }
  .tag.down{ color:var(--down); }
  .tag.neutral{ color:var(--gold); }
  .card-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    color:var(--slate);
    margin-left:auto;
  }

  .card h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.12rem;
    line-height:1.28;
    margin:0 0 8px;
    transition:color 0.15s ease;
  }
  .card:hover h3{ color:var(--gold); }
  .card a.headline-link:hover{ text-decoration:underline; }

  .card p.blurb{
    font-size:0.88rem;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 8px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height 0.28s ease, opacity 0.28s ease;
  }
  .card.open p.blurb{
    max-height:260px;
    opacity:1;
  }

  .card-source{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    color:var(--slate);
  }

  .skeleton{
    height:14px;
    background:linear-gradient(90deg, var(--paper-dim) 25%, rgba(255,255,255,0.4) 50%, var(--paper-dim) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border-radius:3px;
    margin-bottom:10px;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }

  .error-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--down);
    padding:10px 0;
  }

  /* ---------- SNAPSHOT STRIP ---------- */
  .snapshot{
    max-width:var(--max);
    margin:8px auto 0;
    padding:0 28px 8px;
  }
  .snapshot-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
  }
  @media (max-width:600px){ .snapshot-grid{ grid-template-columns:repeat(2,1fr); } }
  .snapshot-cell{
    background:var(--paper);
    padding:14px 16px;
  }
  .snapshot-cell .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    letter-spacing:0.1em;
    color:var(--slate);
    text-transform:uppercase;
  }
  .snapshot-cell .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.05rem;
    margin-top:4px;
  }
  .snapshot-cell .value.up{ color:var(--up); }
  .snapshot-cell .value.down{ color:var(--down); }

  /* ---------- FOOTER ---------- */
  footer{
    max-width:var(--max);
    margin:0 auto;
    padding:36px 28px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
  }
  footer .edition{ color:var(--slate); }
  #refresh-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    background:none;
    border:1px solid var(--ink-soft);
    color:var(--ink);
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  #refresh-btn:hover{ background:var(--ink); color:var(--paper); }

  @media (prefers-reduced-motion: reduce){
    .ticker{ animation:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
  </div>

  <header class="masthead">
    <div class="eyebrow"><span id="edition-date">LOADING EDITION…</span><span class="sep">·</span><span id="status-line">fetching live headlines</span></div>
    <h1 class="wordmark">Ledger<span class="amp">&amp;</span>Latency</h1>
    <p class="subline">Markets that move money, machines that move markets, and the sector news that connects them — <em>read in the time it takes your chai to cool.</em></p>
  </header>

  <hr class="masthead-rule">

  <section class="snapshot">
    <div class="snapshot-grid" id="snapshot"></div>
  </section>

  <main class="desks">
    <div class="desk finance">
      <div class="desk-head">
        <div class="desk-title">Finance</div>
        <div class="desk-label">Desk 01</div>
      </div>
      <div id="finance-list"></div>
    </div>

    <div class="desk sector">
      <div class="desk-head">
        <div class="desk-title">Sector Watch</div>
        <div class="desk-label">Desk 02</div>
      </div>
      <div id="sector-list"></div>
    </div>

    <div class="desk tech">
      <div class="desk-head">
        <div class="desk-title">Technology</div>
        <div class="desk-label">Desk 03</div>
      </div>
      <div id="tech-list"></div>
    </div>
  </main>

  <footer>
    <span class="edition" id="edition-label">No. 001 — Personal edition, built for Sarthak</span>
    <button id="refresh-btn">↻ Refresh now</button>
  </footer>

<script>
/* ============================================================
   CONFIG — edit these to change sources or add your own RSS2JSON key.
   Get a free key at https://rss2json.com/ (raises the daily request
   limit well beyond the shared anonymous quota). Paste it below.
   ============================================================ */

const RSS2JSON_API_KEY = ""; // optional: paste your free rss2json.com key here

const FEEDS = {
  finance: [
    "https://www.livemint.com/rss/markets",
    "https://www.moneycontrol.com/rss/latestnews.xml"
  ],
  sector: [
    "https://www.livemint.com/rss/industry",
    "https://www.livemint.com/rss/companies"
  ],
  tech: [
    "https://techcrunch.com/feed/",
    "https://www.theverge.com/rss/index.xml"
  ]
};

const MAX_ITEMS_PER_DESK = 6;
const CACHE_KEY = "ledgerAndLatencyCache_v1";
const CACHE_TTL_MS = 1000 * 60 * 60 * 6; // refetch at most every 6 hours

/* Fallback content shown only if every live fetch fails (e.g. offline,
   or the free RSS2JSON quota is exhausted for the day). */
const FALLBACK = {
  finance: [{ tag:"MARKETS", dir:"neutral", time:"—", headline:"Live feed unavailable right now — check your connection or try Refresh.", blurb:"", source:"", link:"#" }],
  sector: [{ tag:"SECTOR", dir:"neutral", time:"—", headline:"Live feed unavailable right now — check your connection or try Refresh.", blurb:"", source:"", link:"#" }],
  tech: [{ tag:"TECH", dir:"neutral", time:"—", headline:"Live feed unavailable right now — check your connection or try Refresh.", blurb:"", source:"", link:"#" }]
};

const SNAPSHOT_FALLBACK = [
  { label:"Sensex", value:"—", change:"live data pending", dir:"neutral" },
  { label:"Nifty 50", value:"—", change:"live data pending", dir:"neutral" },
  { label:"Edition refreshes", value:"every 6h", change:"or on demand", dir:"neutral" },
  { label:"Sources", value:"6 live feeds", change:"finance / sector / tech", dir:"neutral" },
];

/* ============================================================
   KEYWORD HEURISTICS — used only to color-tag headlines up/down/neutral.
   Approximate by design; it's a visual cue, not a market signal.
   ============================================================ */
const UP_WORDS = ["surge","surges","jump","jumps","gain","gains","gainer","rally","rallies","rise","rises","rose","soar","soars","climb","climbs","beat","beats","record high","upgrade","upgraded","profit up","funding round","raises $","launch","launches","unveils","approve","approves","approved"];
const DOWN_WORDS = ["fall","falls","fell","drop","drops","slump","slumps","plunge","plunges","decline","declines","cut","cuts","downgrade","downgraded","loss","losses","lawsuit","hack","hacked","breach","ban","banned","exploit","exploited","vulnerability","layoff","layoffs","recall","fraud","fine","fined","probe","raid"];

function guessDirection(text){
  const t = text.toLowerCase();
  if (DOWN_WORDS.some(w => t.includes(w))) return "down";
  if (UP_WORDS.some(w => t.includes(w))) return "up";
  return "neutral";
}

function guessTag(desk, text){
  const t = text.toLowerCase();
  if (desk === "tech"){
    if (t.includes("ai") || t.includes("chatbot") || t.includes("llm")) return "AI";
    if (t.includes("security") || t.includes("hack") || t.includes("breach") || t.includes("vulnerab")) return "SECURITY";
    if (t.includes("chip") || t.includes("semiconductor") || t.includes("memory")) return "HARDWARE";
    if (t.includes("regulat") || t.includes("policy") || t.includes("law")) return "REGULATION";
    return "TECH";
  }
  if (desk === "sector"){
    if (t.includes("auto") || t.includes("ev ")) return "AUTO";
    if (t.includes("bank") || t.includes("nbfc") || t.includes("rbi")) return "BFSI";
    if (t.includes("oil") || t.includes("crude") || t.includes("energy")) return "ENERGY";
    if (t.includes("it ") || t.includes("software")) return "IT";
    if (t.includes("realty") || t.includes("real estate")) return "REALTY";
    return "SECTOR";
  }
  if (t.includes("sensex") || t.includes("nifty")) return "INDICES";
  if (t.includes("bond") || t.includes("yield")) return "BONDS";
  if (t.includes("ipo")) return "IPO";
  return "MARKETS";
}

function timeAgo(pubDate){
  if (!pubDate) return "—";
  const then = new Date(pubDate).getTime();
  if (isNaN(then)) return "—";
  const diffMin = Math.max(1, Math.round((Date.now() - then) / 60000));
  if (diffMin < 60) return diffMin + "m ago";
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return diffHr + "h ago";
  return Math.round(diffHr / 24) + "d ago";
}

function stripHtml(html){
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").trim();
}

async function fetchFeed(url){
  const encoded = encodeURIComponent(url);
  const keyParam = RSS2JSON_API_KEY ? ("&api_key=" + RSS2JSON_API_KEY) : "";
  const api = `https://api.rss2json.com/v1/api.json?rss_url=${encoded}${keyParam}`;
  const res = await fetch(api);
  if (!res.ok) throw new Error("Feed request failed: " + url);
  const data = await res.json();
  if (data.status !== "ok") throw new Error("Feed parse failed: " + url);
  return data.items || [];
}

async function loadDesk(deskName){
  const urls = FEEDS[deskName];
  const results = await Promise.allSettled(urls.map(fetchFeed));
  let items = [];
  results.forEach(r => { if (r.status === "fulfilled") items = items.concat(r.value); });

  if (items.length === 0) throw new Error("All feeds failed for " + deskName);

  items.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));

  return items.slice(0, MAX_ITEMS_PER_DESK).map(item => {
    const cleanDesc = stripHtml(item.description).slice(0, 220);
    const combined = item.title + " " + cleanDesc;
    return {
      tag: guessTag(deskName, combined),
      dir: guessDirection(combined),
      time: timeAgo(item.pubDate),
      headline: item.title,
      blurb: cleanDesc + (cleanDesc.length === 220 ? "…" : ""),
      source: (item.author || new URL(item.link).hostname.replace("www.","")),
      link: item.link
    };
  });
}

/* ============================================================
   RENDER
   ============================================================ */

function renderSnapshot(data){
  document.getElementById('snapshot').innerHTML = data.map(s => `
    <div class="snapshot-cell">
      <div class="label">${s.label}</div>
      <div class="value ${s.dir}">${s.value}</div>
      <div class="label" style="margin-top:2px; text-transform:none; letter-spacing:0;">${s.change}</div>
    </div>
  `).join('');
}

function renderTicker(allItems){
  const el = document.getElementById('ticker');
  if (allItems.length === 0) return;
  const build = () => allItems.map(t => `
    <span class="item ${t.dir}">
      <strong>${t.tag}</strong> ${t.headline.slice(0,70)}
    </span><span class="dot">/</span>
  `).join('');
  el.innerHTML = build() + build();
}

function renderSkeleton(containerId, count){
  const el = document.getElementById(containerId);
  let html = "";
  for (let i=0;i<count;i++){
    html += `<div class="card"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:60%"></div></div>`;
  }
  el.innerHTML = html;
}

function renderList(containerId, items){
  const el = document.getElementById(containerId);
  if (!items.length){
    el.innerHTML = `<div class="error-note">No headlines available right now.</div>`;
    return;
  }
  el.innerHTML = items.map((item, i) => `
    <article class="card" data-id="${containerId}-${i}">
      <div class="card-top">
        <span class="tag ${item.dir}">${item.tag}</span>
        <span class="card-time">${item.time}</span>
      </div>
      <h3><a class="headline-link" href="${item.link}" target="_blank" rel="noopener">${item.headline}</a></h3>
      <p class="blurb">${item.blurb}</p>
      <div class="card-source">${item.source}</div>
    </article>
  `).join('');

  el.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      card.classList.toggle('open');
    });
  });
}

function setStatus(text){
  document.getElementById('status-line').textContent = text;
}

function setEditionDate(){
  const now = new Date();
  document.getElementById('edition-date').textContent =
    now.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).toUpperCase();
}

/* ============================================================
   CACHE + LOAD ORCHESTRATION
   ============================================================ */

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.savedAt > CACHE_TTL_MS) return null;
    return parsed;
  }catch(e){ return null; }
}

function writeCache(payload){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ...payload, savedAt: Date.now() }));
  }catch(e){ /* storage unavailable, ignore */ }
}

async function loadEdition(force){
  setEditionDate();

  if (!force){
    const cached = readCache();
    if (cached){
      renderSnapshot(cached.snapshot);
      renderList('finance-list', cached.finance);
      renderList('sector-list', cached.sector);
      renderList('tech-list', cached.tech);
      renderTicker([...cached.finance, ...cached.sector, ...cached.tech].slice(0,10));
      setStatus("last refreshed " + timeAgo(new Date(cached.savedAt).toString()));
      return;
    }
  }

  setStatus("fetching live headlines…");
  renderSkeleton('finance-list', 4);
  renderSkeleton('sector-list', 4);
  renderSkeleton('tech-list', 4);
  renderSnapshot(SNAPSHOT_FALLBACK);

  const [financeR, sectorR, techR] = await Promise.allSettled([
    loadDesk('finance'), loadDesk('sector'), loadDesk('tech')
  ]);

  const finance = financeR.status === 'fulfilled' ? financeR.value : FALLBACK.finance;
  const sector  = sectorR.status  === 'fulfilled' ? sectorR.value  : FALLBACK.sector;
  const tech    = techR.status    === 'fulfilled' ? techR.value    : FALLBACK.tech;

  renderList('finance-list', finance);
  renderList('sector-list', sector);
  renderList('tech-list', tech);
  renderTicker([...finance, ...sector, ...tech].slice(0,10));

  const allFailed = [financeR, sectorR, techR].every(r => r.status === 'rejected');
  setStatus(allFailed ? "live fetch failed — showing fallback" : "live · updated just now");

  writeCache({ snapshot: SNAPSHOT_FALLBACK, finance, sector, tech });
}

document.getElementById('refresh-btn').addEventListener('click', () => loadEdition(true));

loadEdition(false);
</script>

</body>
</html>
